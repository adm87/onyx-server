services:
  postgres:
    image: postgres:16-alpine
    container_name: onyx-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    env_file:
      - .env
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 2s
      timeout: 5s
      retries: 10

  auth_migration:
    image: migrate/migrate:v4.15.2
    container_name: onyx-migration-auth
    command: ["-path", "/migrations/auth", "-database", "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable&search_path=auth,public&x-migrations-table=auth_schema_migrations", "up"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations/auth:/migrations/auth

  users_migration:
    image: migrate/migrate:v4.15.2
    container_name: onyx-migration-users
    command: ["-path", "/migrations/users", "-database", "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable&search_path=users,public&x-migrations-table=users_schema_migrations", "up"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations/users:/migrations/users
      
  auth-service:
    build:
      context: .
      dockerfile: ./build/services/Dockerfile
      args:
        SERVICE: auth
        GO_VERSION: ${GO_VERSION:-1.26.5}
    container_name: onyx-auth-service
    env_file:
      - .env
    ports:
      - "50051:50051"
    depends_on:
      postgres:
        condition: service_healthy
      auth_migration:
        condition: service_completed_successfully

  user-service:
    build:
      context: .
      dockerfile: ./build/services/Dockerfile
      args:
        SERVICE: user
        GO_VERSION: ${GO_VERSION:-1.26.5}
    container_name: onyx-user-service
    env_file:
      - .env
    ports:
      - "50052:50052"
    depends_on:
      postgres:
        condition: service_healthy
      users_migration:
        condition: service_completed_successfully

  gateway:
    build:
      context: .
      dockerfile: ./build/gateway/Dockerfile
    container_name: onyx-gateway
    env_file:
      - .env
    ports:
      - "8080:8080"
    depends_on:
      - auth-service
      - user-service

volumes:
  pgdata:
