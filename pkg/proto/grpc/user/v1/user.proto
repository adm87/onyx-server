syntax = "proto3";

package user.v1;

import "google/api/annotations.proto";

option go_package = "github.com/adm87/onyx-server/pkg/proto/generated/grpc/user/v1;userv1";

service UserService {
  rpc GetUser(GetUserRequest) returns (GetUserResponse) {
    option (google.api.http) = {
      get: "/v1/user/{user_id}"
    };
  }
}

message GetUserRequest {
  string user_id = 1;
}

message GetUserResponse {
  string user_id = 1;
  string email = 2;
  string name = 3;
}