syntax = "proto3";

package user.v1;

import "google/api/annotations.proto";

option go_package = "github.com/adm87/onyx-server/pkg/proto/generated/grpc/user/v1;userv1";

service UserService {
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse) {
    option (google.api.http) = {
      post: "/v1/users"
      body: "*"
    };
  }
}

message CreateUserRequest {
  string username = 1;
  string email = 2;
  string password = 3;
}

message CreateUserResponse {
  string id = 1;
}